<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2020"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080000"/>
      <stop offset="100%" style="stop-color:#130000"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a0000"/>
      <stop offset="100%" style="stop-color:#0d0000"/>
    </linearGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="faceGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="200" rx="14" fill="url(#bgGrad)"/>
  <rect width="480" height="200" rx="14" fill="none" stroke="#770000" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ===================== -->
  <!--   PANTHER FACE        -->
  <!-- Front-facing panther  -->
  <!-- ===================== -->
  <g transform="translate(100, 100)">

    <!-- Outer head / rounded wide cat skull -->
    <ellipse cx="0" cy="0" rx="72" ry="66" fill="url(#furGrad)" stroke="#CC0000" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Forehead fur texture lines (faint) -->
    <path d="M-18,-52 C-12,-60 12,-60 18,-52" fill="none" stroke="#CC0000" stroke-width="1" stroke-opacity="0.25"/>

    <!-- LEFT EAR — wide triangular cat ear, close to head -->
    <path d="M-44,-52 C-58,-78 -36,-84 -22,-62" fill="url(#furGrad)" stroke="#CC0000" stroke-width="1.8"/>
    <!-- Left ear inner -->
    <path d="M-42,-55 C-52,-72 -38,-76 -28,-62" fill="#3a0000" stroke="none"/>

    <!-- RIGHT EAR -->
    <path d="M44,-52 C58,-78 36,-84 22,-62" fill="url(#furGrad)" stroke="#CC0000" stroke-width="1.8"/>
    <!-- Right ear inner -->
    <path d="M42,-55 C52,-72 38,-76 28,-62" fill="#3a0000" stroke="none"/>

    <!-- Brow ridge shadow -->
    <path d="M-50,-10 C-36,-24 -16,-28 0,-26 C16,-28 36,-24 50,-10" fill="none" stroke="#CC0000" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- LEFT EYE -->
    <g transform="translate(-24, -8)">
      <!-- Eye socket shadow -->
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#0a0000"/>
      <!-- Iris glow -->
      <ellipse cx="0" cy="0" rx="12" ry="10" fill="#CC0000" filter="url(#eyeGlow)"/>
      <!-- Iris inner -->
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#FF1A1A"/>
      <!-- Slit pupil -->
      <ellipse cx="0" cy="0" rx="2.5" ry="8" fill="#050000"/>
      <!-- Shine -->
      <ellipse cx="-4" cy="-3" rx="2.5" ry="1.5" fill="#FF8888" opacity="0.6"/>
    </g>

    <!-- RIGHT EYE -->
    <g transform="translate(24, -8)">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#0a0000"/>
      <ellipse cx="0" cy="0" rx="12" ry="10" fill="#CC0000" filter="url(#eyeGlow)"/>
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#FF1A1A"/>
      <ellipse cx="0" cy="0" rx="2.5" ry="8" fill="#050000"/>
      <ellipse cx="-4" cy="-3" rx="2.5" ry="1.5" fill="#FF8888" opacity="0.6"/>
    </g>

    <!-- Nose bridge -->
    <path d="M-6,-4 C-4,8 4,8 6,-4" fill="none" stroke="#CC0000" stroke-width="1" stroke-opacity="0.4"/>

    <!-- NOSE — wide flat cat nose -->
    <path d="M-14,18 C-8,14 8,14 14,18 C10,26 -10,26 -14,18Z" fill="#CC0000"/>
    <!-- Nose highlight -->
    <ellipse cx="-4" cy="18" rx="3" ry="2" fill="#FF4444" opacity="0.5"/>

    <!-- Philtrum (line from nose down) -->
    <line x1="0" y1="26" x2="0" y2="33" stroke="#CC0000" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- MOUTH — wide cat grin -->
    <path d="M0,33 C-8,38 -18,36 -22,30" fill="none" stroke="#CC0000" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,33 C8,38 18,36 22,30" fill="none" stroke="#CC0000" stroke-width="1.8" stroke-linecap="round"/>

    <!-- WHISKERS — long, horizontal, clearly cat -->
    <!-- Left whiskers -->
    <line x1="-14" y1="24" x2="-72" y2="16" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="-14" y1="28" x2="-72" y2="28" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="-14" y1="32" x2="-72" y2="40" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Right whiskers -->
    <line x1="14" y1="24" x2="72" y2="16" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="14" y1="28" x2="72" y2="28" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="14" y1="32" x2="72" y2="40" stroke="#CC0000" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Chin fur -->
    <ellipse cx="0" cy="44" rx="22" ry="14" fill="#1e0000" stroke="none"/>

    <!-- Fur texture marks on cheeks (faint spots typical of black panther) -->
    <circle cx="-38" cy="20" r="3" fill="#220000" stroke="#CC0000" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="-30" cy="30" r="2.5" fill="#220000" stroke="#CC0000" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="38" cy="20" r="3" fill="#220000" stroke="#CC0000" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="30" cy="30" r="2.5" fill="#220000" stroke="#CC0000" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Vertical divider -->
  <line x1="196" y1="36" x2="196" y2="164" stroke="#770000" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- ELITE wordmark -->
  <text x="216" y="132"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="76"
    font-weight="700"
    letter-spacing="6"
    fill="url(#redGrad)"
    filter="url(#textGlow)">ELITE</text>

  <!-- Underline accent -->
  <line x1="216" y1="148" x2="462" y2="148" stroke="url(#redGrad)" stroke-width="1.2" opacity="0.45"/>
</svg>
