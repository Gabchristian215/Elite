<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="login.css">
    <style>
    </style>
</head>
<body>
    <!-- add logo on top -->
      <img class="elite" src="logo.png" >
    <div class="login-box">
        <div>
         <header class="login-header"> Welcome back </header>
         <p class="under-header"> Sign in to access your dashboard </p>

        </div>
        
        <div class="input-box">
            <input type="text" class="input-field" placeholder="Email" autocomplete="off" required>
        </div>
        <div class="input-box">
            <input type="password" class="input-field" placeholder="password" autocomplete="off" required>
        </div>

        <div class="forgot">
            <section>
                <input type="checkbox" id="check">
                <label for="check">Remember Me</label>
            </section>
        </div>
        
        <div class="input-submit">
            <button class="submit-btn" id="submit">Sign In</button>
        </div>

        <div class="sign-up-link">
            <p>Dont have an account? <a href=#>Sign Up</a></p>
        </div>
        <div class="forgot-password">
            <p>Forgot password? <a href=#>Click here</a></p>
        </div>
        <!-- add forgot password or email href-->
    </div>

</body>
</html>
